<div class="chat-fab">
    <button class="chat-fab-btn" id="chatToggle">
        <ion-icon name="chatbubbles-outline"></ion-icon>
    </button>
</div>

<div class="chat-window" id="chatWindow">
    <div class="chat-header">
        <div class="chat-header-top">
            <span class="chat-title">Atlas AI</span>

            <div class="chat-actions">
                <button id="chatExpand" type="button">
                    <ion-icon name="expand-outline"></ion-icon>
                </button>

                <button id="chatClose" type="button">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>
        </div>

        <div class="chat-header-bottom">
            <select id="agentSelect" aria-label="Selecionar agente">
                <option value="gemini">Gemini</option>
                <option value="llama">Llama</option>
                <option value="huggingface">Hugging Face</option>
            </select>

            <span class="model-info" id="modelInfo">
                Modelo: <strong id="modelLabel">Carregando...</strong>
            </span>
        </div>
    </div>

    <div class="chat-body" id="chatBody" aria-live="polite">
        <div class="chat-message bot">
            Olá! Sou o Atlas AI. Como posso ajudar?
        </div>
    </div>

    <form class="chat-input" id="chatForm">
        <input
            type="text"
            id="chatInput"
            placeholder="Digite sua mensagem..."
            autocomplete="off"
            required
        />

        <button type="submit" id="chatSend">
            <ion-icon name="send-outline"></ion-icon>
        </button>
    </form>
</div>

<script src="{{ '_assets/js/global/chat.js' | relative_url }}"></script>
